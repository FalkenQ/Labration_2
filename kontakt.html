            <form>
                <label for="name">Namn:</label>

                <label for="message">Meddelande:</label>
                <br>
                <textarea id="message" name="message" required
                placeholder="Skriv ditt meddelande här"></textarea>
                <br>
                <button type="submit">Skicka in</button>
